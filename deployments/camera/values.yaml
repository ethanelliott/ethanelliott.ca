replicaCount: 1

image:
  repository: ethanelliottio/camera
  tag: s-3b14eac
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  hostname: 'camera-api.elliott.haus'
  cors:
    enabled: true
    allowOrigins:
      - https://camera.elliott.haus

resources:
  limits:
    cpu: '2'
    memory: 1536Mi
  requests:
    cpu: '1'
    memory: 768Mi

env:
  NODE_ENV: 'production'
  HOST: '0.0.0.0'
  PORT: '3000'
  CAMERA_IP: '192.168.86.34'
  CAMERA_MODEL: 'Arenti a3'
  CAMERA_ONVIF_PORT: '8000'
  CAMERA_RTSP_PORT: '8554'
  CAMERA_RTSP_PATH: '/Streaming/Channels/101'
  # Inference rate while a subject is being tracked. The motion gate keeps an
  # idle scene from paying for it, and the higher rate is what makes tracking
  # a walking subject reliable — at 5 FPS the boxes stop overlapping and one
  # crossing splits into a dozen events.
  DETECTION_FPS: '10'
  MOTION_CHECK_FPS: '4'
  # MobileNet resizes its input internally, so decoding 720p for it was
  # spending the frame budget on pixels the model throws away.
  DETECTION_INPUT_WIDTH: '640'
  DETECTION_THRESHOLD: '0.6'
  ANALYSIS_QUEUE_MAX: '200'
  ANALYSIS_QUEUE_ATTEMPTS: '4'
  DATA_DIR: '/app/data'
  NTFY_SERVER_URL: 'http://ntfy.elliott-haus.svc.cluster.local'
  NTFY_TOPIC: 'camera-detections'
  # Alerts link back to the moment they describe, so tapping one opens the
  # timeline paused there rather than at the live edge.
  CAMERA_APP_URL: 'https://camera.elliott.haus'
  OLLAMA_URL: 'http://ollama.elliott-haus.svc.cluster.local:11434'
  OLLAMA_MODEL: 'qwen3-vl:4b'
  RETENTION_DAYS: '7'
  CLEANUP_INTERVAL_MINUTES: '30'
  MAX_SNAPSHOTS: '5000'
  DISK_THRESHOLD_PCT: '85'
  RECORDING_ENABLED: 'true'
  RECORDING_SEGMENT_SECONDS: '10'
  VIDEO_RETENTION_DAYS: '3'

# Camera credentials from Kubernetes Secret
secretEnv:
  - name: CAMERA_USERNAME
    secretName: camera-credentials
    secretKey: username
  - name: CAMERA_PASSWORD
    secretName: camera-credentials
    secretKey: password

# Set to true to create the secret via Helm (for development/testing)
createSecret: false
secretData:
  username: admin
  password: changeme

storage:
  size: 100Gi
  storageClass: local-path
  volumeMode: Filesystem

# Enable host network if the K8s cluster can't reach the camera subnet
hostNetwork: false
