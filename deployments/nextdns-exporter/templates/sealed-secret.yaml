apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: nextdns-exporter-secrets
  namespace: elliott-haus
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
